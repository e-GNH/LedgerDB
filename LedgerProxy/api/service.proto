syntax = "proto3";

option go_package = "LedgerProxy/api/pb";

package LedgerProxy;

// SecurityService handles the decryption, authentication, and 
// integrity validation of incoming ledger transactions.
service SecurityService {
    // Execute accepts a hybrid-encrypted payload, decrypts it, and 
    // verifies the sender's signature, data hash, and timeliness.
    rpc Execute(SecureRequest) returns (SecureResponse) {}
    rpc OfflineWithdraw(SecureRequest) returns (SecureResponse) {}
    rpc OfflineDeposit(SecureRequest) returns (SecureResponse) {}
    rpc CreateAccount(SecureRequest) returns (SecureResponse) {}
}

message SecureRequest {
    bytes encrypted_data = 1; 
}

message SecureResponse {
    bool success = 1;
    string message = 2; // Optional: details about the result
}

// ReceiptService allows banks to subscribe to their transaction receipts
// Banks hold a persistent open stream identified by their wallet prefix
service ReceiptService {
    // Subscribe opens a long-lived server-streaming connection.
    // The bank sends its prefix (e.g. "000") and receives receipts
    // whenever a transaction involving one of its wallets is committed.
    rpc Subscribe(SubscribeRequest) returns (stream TransactionReceipt) {}
}

message SubscribeRequest {
    string bank_prefix = 1; // e.g. "000", "001"
}

message TransactionReceipt {
    string hash        = 1;
    bool   status      = 2;
    string from_wallet = 3;
    string to_wallet   = 4;
    float  amount      = 5;
    string message     = 6;
    string nonce       = 7;
    string time_stamp  = 8;
}