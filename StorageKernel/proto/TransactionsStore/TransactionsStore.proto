syntax = "proto3";

import "google/protobuf/any.proto";

package TransactionsStore;

option go_package = "StorageKernel/proto/TransactionsStore";

service TransactionsStoreService {
  rpc Store(google.protobuf.Any) returns (StoreAck);
}

// Simple ack 
message StoreAck {
  bool   success  = 1;
  string batch_id = 2;
}
