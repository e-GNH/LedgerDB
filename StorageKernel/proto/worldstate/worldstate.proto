syntax = "proto3";

package worldstate;

option go_package = "ledgerdb/proto/worldstate";

service WorldStateService {
  rpc Transfer(TransferRequest) returns (TransferResponse);
}

message TransferRequest {
  string nonce   = 1;
  string from_id = 2;
  string to_id   = 3;
  int64  amount  = 4;
}

message TransferResponse {
  bool   ok      = 1;
  string message = 2;
}